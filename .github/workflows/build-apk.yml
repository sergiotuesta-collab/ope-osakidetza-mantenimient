name: Compilar APK Agenda Synology

on:
  workflow_dispatch:
  push:
    paths:
      - "SynologyAgendaWidget-v1.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Descomprimir proyecto
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q SynologyAgendaWidget-v1.zip -d build-project
          echo "Contenido:"
          find build-project -maxdepth 3 -type f

      - name: Localizar proyecto Android
        run: |
          SETTINGS=$(find build-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*debug*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK"
            exit 1
          fi
          mkdir -p apk
          cp "$APK" apk/AgendaSynology.apk
          ls -lh apk/AgendaSynology.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSynology-APK
          path: apk/AgendaSynology.apk
          retention-days: 30
