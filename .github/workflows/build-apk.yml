name: Compilar APK Agenda Synology
on:
  push:
    paths:
      - 'SynologyAgendaWidget-v6-0-1-MAILPLUS-ACCESS.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Descomprimir proyecto v6.0.1 MAILPLUS ACCESS
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q SynologyAgendaWidget-v6-0-1-MAILPLUS-ACCESS.zip -d buildsrc
      - name: Localizar proyecto Android
        run: |
          PROJECT_DIR=$(dirname "$(find buildsrc -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Preparar firma permanente
        env:
          AGENDA_SIGNING: ${{ secrets.AGENDA_SIGNING }}
        run: |
          echo "$AGENDA_SIGNING" | base64 -d > "$PROJECT_DIR/agenda-release.jks"
          cat >> "$PROJECT_DIR/gradle.properties" <<'EOF'
          AGENDA_STORE_FILE=agenda-release.jks
          AGENDA_STORE_PASSWORD=${{ secrets.AGENDA_STORE_PASSWORD }}
          AGENDA_KEY_ALIAS=agenda
          AGENDA_KEY_PASSWORD=${{ secrets.AGENDA_KEY_PASSWORD }}
          EOF
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK release firmada
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease
      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name '*.apk' -print -quit)
          test -n "$APK"
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner verify --verbose "$APK"
          cp "$APK" /tmp/AgendaSynology-v6.0.1-MAILPLUS-ACCESS.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSynology-v6.0.1-MAILPLUS-ACCESS-APK
          path: /tmp/AgendaSynology-v6.0.1-MAILPLUS-ACCESS.apk
          retention-days: 30
