name: Compilar APK Agenda Synology

on:
  workflow_dispatch:
  push:
    paths:
      - "SynologyAgendaWidget-v4-1.zip.b64"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Recuperar proyecto v4
        run: |
          rm -rf build-project SynologyAgendaWidget-v4-1.zip
          base64 -d SynologyAgendaWidget-v4-1.zip.b64 > SynologyAgendaWidget-v4-1.zip
          mkdir build-project
          unzip -q SynologyAgendaWidget-v4-1.zip -d build-project

      - name: Localizar proyecto Android
        run: |
          SETTINGS=$(find build-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar firma permanente
        env:
          AGENDA_SIGNING: ${{ secrets.AGENDA_SIGNING }}
        run: |
          if [ -z "$AGENDA_SIGNING" ]; then
            echo "ERROR: falta el secret AGENDA_SIGNING"
            exit 1
          fi
          echo "$AGENDA_SIGNING" | jq -r '.keystore' | base64 -d > "$RUNNER_TEMP/agenda-signing.jks"
          PASSWORD=$(echo "$AGENDA_SIGNING" | jq -r '.password')
          if [ -z "$PASSWORD" ] || [ "$PASSWORD" = "null" ]; then
            echo "ERROR: secret AGENDA_SIGNING no válido"
            exit 1
          fi
          echo "AGENDA_KEYSTORE_PATH=$RUNNER_TEMP/agenda-signing.jks" >> "$GITHUB_ENV"
          echo "AGENDA_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK release firmada
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Verificar APK y firma
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK release"
            exit 1
          fi
          mkdir -p apk
          cp "$APK" apk/AgendaSynology.apk
          keytool -list -keystore "$AGENDA_KEYSTORE_PATH" -storepass "$AGENDA_KEYSTORE_PASSWORD" -alias agenda | grep -E "SHA256|Owner|Valid" || true
          sha256sum apk/AgendaSynology.apk
          ls -lh apk/AgendaSynology.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSynology-v4-APK
          path: apk/AgendaSynology.apk
          retention-days: 30
