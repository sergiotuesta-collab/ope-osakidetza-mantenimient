namename: Compilar APK Agenda Synology

on:
  workflow_dispatch:
  push:
    paths:
      - "SynologyAgendaWidget-v4-3.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Descomprimir proyecto v4-3
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q SynologyAgendaWidget-v4-3.zip -d build-project
          echo "Contenido del proyecto:"
          find build-project -maxdepth 3 -type f | sort

      - name: Localizar proyecto Android
        run: |
          SETTINGS=$(find build-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"
