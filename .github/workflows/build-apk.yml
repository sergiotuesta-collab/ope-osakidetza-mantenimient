name: Compilar APK Agenda Synology
on:
  push:
    paths:
      - 'SynologyAgendaWidget-v6-0-6-TRUE-ICONS.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Descomprimir proyecto v6.0.6 TRUE ICONS
        run: unzip -q SynologyAgendaWidget-v6-0-6-TRUE-ICONS.zip -d agenda
      - name: Preparar firma permanente
        env:
          AGENDA_SIGNING: ${{ secrets.AGENDA_SIGNING }}
        run: |
          cd agenda
          printf '%s' "$AGENDA_SIGNING" | base64 --decode > agenda-release.jks
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK release firmada
        env:
          AGENDA_STORE_FILE: ${{ github.workspace }}/agenda/agenda-release.jks
          AGENDA_STORE_PASSWORD: ${{ secrets.AGENDA_STORE_PASSWORD }}
          AGENDA_KEY_ALIAS: agenda
          AGENDA_KEY_PASSWORD: ${{ secrets.AGENDA_KEY_PASSWORD }}
        run: cd agenda && gradle :app:assembleRelease --no-daemon
      - name: Verificar APK
        run: |
          APK=$(find agenda/app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          cp "$APK" AgendaSynology.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSynology-v6.0.6-TRUE-ICONS-APK
          path: AgendaSynology.apk
