name: Compilar APK Agenda Synology

on:
  workflow_dispatch:
  push:
    paths:
      - "SynologyAgendaWidget-v4-4.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Descomprimir proyecto v4-4
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q SynologyAgendaWidget-v4-4.zip -d build-project
          echo "Contenido del proyecto:"
          find build-project -maxdepth 3 -type f | sort

      - name: Localizar proyecto Android
        run: |
          SETTINGS=$(find build-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"

      - name: Preparar firma permanente
        env:
          AGENDA_SIGNING: ${{ secrets.AGENDA_SIGNING }}
        run: |
          if [ -z "$AGENDA_SIGNING" ]; then
            echo "ERROR: falta el secret AGENDA_SIGNING"
            exit 1
          fi

          KEYSTORE_B64=$(printf '%s' "$AGENDA_SIGNING" | jq -r '.keystore')
          PASSWORD=$(printf '%s' "$AGENDA_SIGNING" | jq -r '.password')
          ALIAS=$(printf '%s' "$AGENDA_SIGNING" | jq -r '.alias')

          if [ -z "$KEYSTORE_B64" ] || [ "$KEYSTORE_B64" = "null" ] ||              [ -z "$PASSWORD" ] || [ "$PASSWORD" = "null" ] ||              [ "$ALIAS" != "agenda" ]; then
            echo "ERROR: secret AGENDA_SIGNING no válido"
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agenda-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/agenda-signing.jks" -storepass "$PASSWORD" -alias agenda >/dev/null

          echo "AGENDA_KEYSTORE_PATH=$RUNNER_TEMP/agenda-signing.jks" >> "$GITHUB_ENV"
          echo "AGENDA_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compilar APK release firmada
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK release"
            exit 1
          fi

          mkdir -p apk
          cp "$APK" apk/AgendaSynology.apk

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs apk/AgendaSynology.apk
          fi

          sha256sum apk/AgendaSynology.apk
          ls -lh apk/AgendaSynology.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSynology-v4.3-APK
          path: apk/AgendaSynology.apk
          retention-days: 30
