name: Compilar APK Agenda Synology

on:
  workflow_dispatch:
  push:
    paths:
      - "SynologyAgendaWidget-v6-0-7-VERIFIED-UI.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Descomprimir proyecto v6.0.7 VERIFIED UI
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q SynologyAgendaWidget-v6-0-7-VERIFIED-UI.zip -d build-project

      - name: Localizar proyecto Android
        run: |
          SETTINGS=$(find build-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar firma permanente
        env:
          AGENDA_SIGNING: ${{ secrets.AGENDA_SIGNING }}